server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
spring:
  application:
    name: cunmo-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/java/.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

storage:
  avatar-directory: ${AVATAR_STORAGE_DIRECTORY:./data/uploads/avatars}

wechat:
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}
  connect-timeout: 3s
  response-timeout: 5s

membership:
  contact:
    customer-service-enabled: ${MEMBERSHIP_CUSTOMER_SERVICE_ENABLED:false}
    enterprise-wechat-qr-url: ${MEMBERSHIP_ENTERPRISE_WECHAT_QR_URL:}
    phone: ${MEMBERSHIP_CONTACT_PHONE:}
  wechat-pay:
    enabled: ${WECHAT_PAY_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_PAY_MCH_ID:}
    merchant-serial-no: ${WECHAT_PAY_MERCHANT_SERIAL_NO:}
    merchant-private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    platform-certificate-path: ${WECHAT_PAY_PLATFORM_CERT_PATH:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    payment-notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    response-timeout: 8s
    renewal:
      enabled: ${WECHAT_PAY_RENEWAL_ENABLED:false}
      business-type: ${WECHAT_PAY_RENEWAL_BUSINESS_TYPE:}
      plan-id: ${WECHAT_PAY_RENEWAL_PLAN_ID:}
      contract-notify-url: ${WECHAT_PAY_CONTRACT_NOTIFY_URL:}
      charge-url: ${WECHAT_PAY_RENEWAL_CHARGE_URL:}
      terminate-url: ${WECHAT_PAY_RENEWAL_TERMINATE_URL:}
      max-attempts: ${WECHAT_PAY_RENEWAL_MAX_ATTEMPTS:3}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${TOKEN_TTL_SECONDS:7200}
  is-concurrent: true
  is-share: false
  is-log: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    cn.cunmo: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level traceId=%X{traceId:-none} logger=%logger{36} - %msg%n"
